
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visit Austin Competitive Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --co:#9F5C49;--co-b:#C8876E;--co-dark:#6B3325;--co-light:#F5EBE8;
  --ink:#0E1111;--mist:#5C4A45;--faint:#A08880;--bg:#F5F1EF;
  --border:rgba(14,17,17,0.10);--bsoft:rgba(14,17,17,0.06);
}
html,body{height:100%;font-family:"Inter",sans-serif;background:#EDE8E5;color:var(--ink)}
#root{height:100%;display:flex;flex-direction:column;max-width:1300px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,0.12)}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
#topbar-left{display:flex;align-items:center;gap:10px}
.lbl{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
#dest-pill{background:var(--co-light);color:var(--co-dark);font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border-radius:999px;border:1px solid rgba(159,92,73,.25)}
#nav{display:flex;gap:6px;background:#EDE8E5;border-radius:999px;padding:4px}
.ntab{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px;border-radius:999px;border:none;background:transparent;color:var(--mist);cursor:pointer;transition:all .15s}
.ntab.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,0.1)}
#hero{display:flex;align-items:center;gap:20px;padding:16px 20px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
#hero-logo{flex-shrink:0}
#hero-text h1{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(18px,2.2vw,26px);color:var(--ink);line-height:1.1}
#hero-text p{font-size:13px;color:var(--mist);margin-top:4px}
#view{display:flex;flex:1;overflow:hidden}
#sidebar{width:25%;min-width:200px;border-right:1px solid var(--border);overflow-y:auto;padding:16px;background:#fff;flex-shrink:0}
#canvas{flex:1;overflow-y:auto;padding:20px;background:var(--bg);min-width:0}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 3px 14px -6px rgba(10,60,56,.13)}
.sec-head{margin-bottom:8px}
.cpill{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:#F5F1EF;font-size:13px;font-weight:500;color:var(--mist);cursor:pointer;transition:all .15s;text-align:left;font-family:"Inter",sans-serif;line-height:1.3;margin-bottom:6px}
.cpill:hover{border-color:var(--faint);color:var(--ink)}
.cpill.on{background:#0E1111;color:#fff;border-color:#0E1111}
.cpill .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sdiv{border-top:1px solid var(--bsoft);padding-top:14px;margin-top:6px}
.fadein{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.gauge-wrap{position:relative;height:9px;border-radius:999px;background:linear-gradient(90deg,#9F5C49 0%,#B5892A 52%,#C64B4B 100%);border:1px solid var(--bsoft);margin:8px 0}
.gauge-needle{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2);transition:left .4s ease}
.swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.swot-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
.swot-box h4{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
.swot-box ul{padding-left:16px}
.swot-box li{font-size:12.5px;color:#2A4540;line-height:1.5;margin-bottom:4px}
.swot-s h4{color:#5C7A3A}.swot-w h4{color:#A04040}.swot-o h4{color:#3A5F8A}.swot-t h4{color:#8A4A20}
.take-card{border-left:4px solid var(--co);background:#FBF5F3;border-radius:0 12px 12px 0;padding:14px 16px;margin-top:16px}
.take-card p{font-size:13px;line-height:1.6;color:var(--ink)}
.comp-header{display:flex;align-items:center;gap:12px;padding:16px;background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:12px}
.comp-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.comp-name{font-family:"Fraunces",serif;font-weight:600;font-size:20px;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--mist);border:1px solid var(--border)}
.idx-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.context-card{background:var(--co-light);border:1px solid rgba(159,92,73,.15);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap}
.ctx-item{font-size:12px;color:var(--co-dark)}
.ctx-item strong{display:block;font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.brand-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.bsum-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.bsum-num{font-family:"Fraunces",serif;font-size:28px;font-weight:600}
.bsum-label{font-size:11px;color:var(--mist);margin-top:2px}
.brand-detail{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.brand-claim{font-family:"Fraunces",serif;font-style:italic;font-size:16px;color:var(--ink);line-height:1.4;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--bsoft)}
.brand-reality{font-size:13px;color:#2A4540;line-height:1.65;margin-bottom:14px}
.gap-bar-wrap{height:8px;border-radius:999px;background:linear-gradient(90deg,#5C7A3A,#C87A20,#C64B4B);position:relative;margin:8px 0}
.gap-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.verdict-pill{display:inline-block;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-top:8px}
.vp-tight{background:#D4F0E5;color:#1A6B57}.vp-moderate{background:#FFF0CC;color:#8A6010}
.vp-significant{background:#FFE5D0;color:#8A3010}.vp-crisis{background:#FFD0D0;color:#8A1010}
.brand-grid{display:grid;gap:10px}
.bg-row{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:160px 1fr 140px 100px;align-items:center;gap:12px;cursor:pointer;transition:background .15s}
.bg-row:hover{background:#F4FCFB}
.bg-row.selected{background:var(--co-light);border-color:rgba(14,143,138,.3)}
.bg-dest{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
.bg-claim{font-size:12px;color:var(--mist);font-style:italic}
.bg-gap-mini{height:6px;border-radius:999px;background:linear-gradient(90deg,#5C7A3A,#C87A20,#C64B4B);position:relative}
.bg-gap-mini-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.ax-select{width:100%;background:#F5F1EF;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:"Inter",sans-serif;font-size:13px;color:var(--ink);margin-bottom:8px}
.axis-chip{display:inline-flex;align-items:center;gap:6px;background:var(--co-light);border:1px solid rgba(159,92,73,.2);border-radius:999px;padding:5px 12px;font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--co-dark);margin-right:6px;margin-bottom:6px}
.aep{font-family:"Space Mono",monospace;font-size:9px;text-transform:uppercase;color:var(--co);background:var(--co-light);padding:3px 8px;border-radius:999px;margin-right:4px;display:inline-block;margin-bottom:4px}
.dest-token{position:absolute;transform:translate(-50%,-50%);cursor:default;text-align:center}
.tok-dot{border-radius:50%;margin:0 auto}
.tok-name{font-family:"Space Mono",monospace;text-align:center;margin-top:3px;line-height:1.2;white-space:nowrap}

.map-tok{position:absolute;transform:translate(-50%,-50%);z-index:10;transition:left .5s ease-in-out,top .5s ease-in-out;overflow:visible}
.tok-ring{position:absolute;inset:-14px;border-radius:50%;border:1.5px solid currentColor;opacity:.38;pointer-events:none}
.tok-dot{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;color:#fff;letter-spacing:.02em;user-select:none;position:relative;z-index:1}
.note{font-size:11px;color:var(--faint)}
</style>
</head>

  const lk=(x,y)=>NAMED[x+'|'+y]||NAMED[y+'|'+x]||'';
  return{tr:lk(xd.r,yd.r),tl:lk(xd.l,yd.r),br:lk(xd.r,yd.l),bl:lk(xd.l,yd.l)};

const S={tab:'swot',origin:'txdrive',season:'festival',comp:'nashville',brandSel:'austin',xAxis:'Music Depth',yAxis:'Event Draw'};
const OL={txdrive:'Texas Drive Market',scfly:'South-Central Fly',ecfly:'East Coast Fly',wcfly:'West Coast Fly'};
const SL={festival:'Festival Peak (Mar / Oct)',spring:'Spring Shoulder (Apr–May)',summer:'Summer (Jun–Aug)',fallwinter:'Fall / Winter (Nov–Feb)'};

function cs(){return COMPSETS[S.origin][S.season];}
function sw(){try{return SWOTS[S.origin][S.season][S.comp];}catch(e){return null;}}

function setTab(t){
  S.tab=t;
  document.querySelectorAll('.ntab').forEach((b,i)=>{b.classList.toggle('on',['swot','brand','sandbox'][i]===t);});
  if(t==='swot'){g('sub').textContent='Head-to-head competitive analysis. Select an origin market, season, and competitor to compare.';rSS();rSC();}
  else if(t==='brand'){g('sub').textContent='Brand platform vs. traveler reality. How well does each destination\'s marketing hold up to the actual experience?';rBS();rBC();}
  else{g('sub').textContent='Plot any two competitive dimensions on a live perceptual map. Swap axes to explore different competitive lenses.';rXS();rXC();}
}

function rSS(){
  const c=cs();
  let h='<div class="lbl sec-head"><span style="color:var(--co)">01 </span>Origin Market</div>';
  ['txdrive','scfly','ecfly','wcfly'].forEach(o=>{h+=`<button class="cpill${S.origin===o?' on':''}" onclick="setO('${o}')">${OL[o]}</button>`;});
  h+='<div class="lbl sec-head sdiv"><span style="color:var(--co)">02 </span>Season</div>';
  ['festival','spring','summer','fallwinter'].forEach(s=>{h+=`<button class="cpill${S.season===s?' on':''}" onclick="setSe('${s}')">${SL[s]}</button>`;});
  h+='<div class="lbl sec-head sdiv"><span style="color:var(--co)">03 </span>Competitor</div>';
  for(const[gn,gc] of Object.entries(c.groups)){
    h+=`<div class="lbl" style="margin:8px 0 4px;font-size:9px">${gn}</div>`;
    gc.forEach(id=>{h+=`<button class="cpill${S.comp===id?' on':''}" onclick="setCo('${id}')"><span class="dot" style="background:${C[id]}"></span>${DN[id]}</button>`;});
  }
  g('sidebar').innerHTML=h;
}
function setO(o){S.origin=o;if(!cs().comps.includes(S.comp))S.comp=cs().comps[0];rSS();rSC();}
function setSe(s){S.season=s;if(!cs().comps.includes(S.comp))S.comp=cs().comps[0];rSS();rSC();}
function setCo(c){S.comp=c;rSS();rSC();}

  const il=ix>15?'Austin leads clearly':ix>0?'Austin leads narrowly':ix>-15?'Competitor leads':'Competitor leads clearly';
  g('canvas').innerHTML=`<div class="fadein">
    <div class="comp-header"><span class="comp-dot" style="background:${C[S.comp]}"></span>
      <div><div class="comp-name">${DN[S.comp]}</div>
      <div class="tags">${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>
    </div>
    <div class="context-card">
      <div class="ctx-item"><strong>Origin</strong>${OL[S.origin]}</div>
      <div class="ctx-item"><strong>Season</strong>${SL[S.season]}</div>
      <div class="ctx-item"><strong>Perspective</strong>Austin vs. ${DN[S.comp]}</div>

      <div style="display:flex;align-items:baseline;gap:10px">

function rBS(){
  let h='<div class="lbl sec-head">Destinations</div>';
  Object.entries(BRANDS).forEach(([id,b])=>{
    h+=`<button class="cpill${S.brandSel===id?' on':''}" onclick="setBr('${id}')"><span class="dot" style="background:${C[id]||'#888'}"></span>${b.name}</button>`;
  });
  g('sidebar').innerHTML=h;
}
function setBr(id){S.brandSel=id;rBS();rBC();}

function vdict(g){
  if(g<=2)return['tight','Tight Fit'];
  if(g<=5)return['moderate','Moderate Gap'];
  if(g<=8)return['significant','Significant Gap'];
  return['crisis','Crisis Gap'];
}

function rBC(){
  const bd=BRANDS[S.brandSel];
  const gaps=Object.values(BRANDS).map(b=>b.gap);
  const tight=gaps.filter(x=>x<=2).length,mod=gaps.filter(x=>x>2&&x<=5).length,sig=gaps.filter(x=>x>5).length;
  const mp=Math.round((bd.gap/10)*100);
  const[vc,vl]=vdict(bd.gap);
  const sorted=Object.entries(BRANDS).sort((a,b)=>a[1].gap-b[1].gap);
  g('canvas').innerHTML=`<div class="fadein">
    <div class="brand-summary">
      <div class="bsum-card"><div class="bsum-num" style="color:#5C7A3A">${tight}</div><div class="bsum-label">Tight Fit (1–2)</div></div>
      <div class="bsum-card"><div class="bsum-num" style="color:#8A6010">${mod}</div><div class="bsum-label">Moderate Gap (3–5)</div></div>
      <div class="bsum-card"><div class="bsum-num" style="color:#8A3010">${sig}</div><div class="bsum-label">Significant Gap (6+)</div></div>
    </div>
    <div class="brand-detail">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <span class="comp-dot" style="background:${C[S.brandSel]}"></span>
        <span style="font-family:'Fraunces',serif;font-size:18px;font-weight:600">${bd.name}</span>
        <span class="verdict-pill vp-${vc}">${vl}</span>
      </div>
      <div class="brand-claim">${bd.tagline}</div>
      <div class="brand-reality">${bd.delivery}</div>
      <div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-family:'Space Mono',monospace;font-size:9px;color:var(--co)">Brand delivers</span>
          <span style="font-family:'Space Mono',monospace;font-size:9px;color:#A04040">Major gap</span>
        </div>
        <div class="gap-bar-wrap"><div class="gap-marker" style="left:${mp}%"></div></div>
        <div style="font-family:'Space Mono',monospace;font-size:9px;color:var(--mist);margin-top:4px">Gap score: ${bd.gap}/10</div>
      </div>
    </div>
    <div style="margin-bottom:8px"><span class="lbl">All Destinations — Sorted Tightest to Largest Gap</span></div>
    <div class="brand-grid">
      ${sorted.map(([id,b])=>{
        const m=Math.round((b.gap/10)*100);const[vc2,vl2]=vdict(b.gap);
        return`<div class="bg-row${S.brandSel===id?' selected':''}" onclick="setBr('${id}')">
          <div class="bg-dest"><span class="dot" style="background:${C[id]||'#888'}"></span>${b.name}</div>
          <div class="bg-claim">${b.tagline}</div>
          <div><div class="bg-gap-mini"><div class="bg-gap-mini-dot" style="left:${m}%"></div></div></div>
          <div><span class="verdict-pill vp-${vc2}" style="font-size:9px">${vl2}</span></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}


function rXS(){
  let h='<div class="lbl sec-head"><span style="color:var(--co)">01 </span>Horizontal (X) Axis</div>';
  AK.forEach(k=>{
    h+=`<button class="cpill${S.xAxis===k?' on':''}" ${S.yAxis===k?'disabled':''} onclick="setAx('x','${k}')">${k}</button>`;
  });
  h+='<div class="lbl sec-head sdiv"><span style="color:var(--co)">02 </span>Vertical (Y) Axis</div>';
  AK.forEach(k=>{
    h+=`<button class="cpill${S.yAxis===k?' on':''}" ${S.xAxis===k?'disabled':''} onclick="setAx('y','${k}')">${k}</button>`;
  });
  g('sidebar').innerHTML=h;
}
function setAx(xy,v){
  if(xy==='x')S.xAxis=v; else S.yAxis=v;
  rXS(); updateSandboxMap();
}

    <div id="ax-xr" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0E1111;text-transform:uppercase;letter-spacing:.1em;background:#fff;border-radius:7px;padding:6px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:25">${xd.r.toUpperCase()} \u2192</div>
    <div id="ax-yt" style="position:absolute;top:14px;left:50%;transform:translateX(-50%);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0E1111;text-transform:uppercase;letter-spacing:.1em;background:#fff;border-radius:7px;padding:6px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:25">\u2191 ${yd.r.toUpperCase()}</div>
    <div id="ax-yb" style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0E1111;text-transform:uppercase;letter-spacing:.1em;background:#fff;border-radius:7px;padding:6px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:25">\u2193 ${yd.l.toUpperCase()}</div>`;
  const allDests=Object.keys(C);
  const toks=allDests.map(d=>{
    const col=BRIGHT[d]||'#999';
    const isCo=d==='austin';
    return `<div id="tok-${d}" class="map-tok" style="left:${toL(xd.s[d]||0)}%;top:${toT(yd.s[d]||0)}%">
      <div class="tok-ring" style="color:${col};inset:${isCo?'-16px':'-11px'};opacity:${isCo?0.7:0.35}"></div>
      <div class="tok-dot" style="background:${col};box-shadow:0 0 ${isCo?'32px':'20px'} ${col}${isCo?'99':'66'},0 0 ${isCo?'12px':'6px'} ${col}${isCo?'66':'44'};width:${isCo?'60px':'48px'};height:${isCo?'60px':'48px'};${isCo?'border:2px solid rgba(255,255,255,0.6)':''}"></div>
      <div style="position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'Inter',sans-serif;font-size:${isCo?'12px':'11px'};font-weight:${isCo?700:600};color:rgba(255,255,255,${isCo?0.98:0.88});background:rgba(20,8,4,0.85);border:1px solid rgba(${isCo?'159,92,73':'255,255,255'},${isCo?0.5:0.12});border-radius:5px;padding:3px 8px;pointer-events:none">${DN[d]}</div>
    </div>`;
  }).join('');
  g('canvas').innerHTML=`<div class="fadein">

      <div class="card" id="chip-x" style="padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:8px"><span class="lbl">X \u2192</span><b>${S.xAxis}</b><span style="color:var(--faint);font-size:10px">${xd.l} \u2194 ${xd.r}</span></div>
      <div class="card" id="chip-y" style="padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:8px"><span class="lbl">Y \u2191</span><b>${S.yAxis}</b><span style="color:var(--faint);font-size:10px">${yd.l} \u2194 ${yd.r}</span></div>

function updateSandboxMap(){
  const xd=AXES[S.xAxis],yd=AXES[S.yAxis];
  const toL=s=>50+s*4,toT=s=>50-s*4;
  Object.keys(C).forEach(d=>{
    const t=g(`tok-${d}`);
    if(t){t.style.left=`${toL(xd.s[d]||0)}%`;t.style.top=`${toT(yd.s[d]||0)}%`;}
  });
  const coQ=(yd.s.austin>=0?'t':'b')+(xd.s.austin>=0?'r':'l');
  const qNames=getQuadrantNames(S.xAxis,S.yAxis);
  const quadAligns={tl:'left',tr:'right',bl:'left',br:'right'};
  ['tl','tr','bl','br'].forEach(q=>{
    const el=g(`qlabel-${q}`);
    if(!el)return;
    const isCo=q===coQ;
    el.style.textAlign=quadAligns[q];
    el.innerHTML=`<div style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:${isCo?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.4)'};line-height:1.4;letter-spacing:0.01em;${isCo?'text-shadow:0 0 20px rgba(159,92,73,0.7)':''}">${qNames[q]}</div>`;
  });
  const xl=g('ax-xl'),xr=g('ax-xr'),yt=g('ax-yt'),yb=g('ax-yb');
  if(xl)xl.textContent=`\u2190 ${xd.l.toUpperCase()}`;
  if(xr)xr.textContent=`${xd.r.toUpperCase()} \u2192`;
  if(yt)yt.textContent=`\u2191 ${yd.r.toUpperCase()}`;
  if(yb)yb.textContent=`\u2193 ${yd.l.toUpperCase()}`;
  const cx=g('chip-x'),cy=g('chip-y');
  if(cx)cx.innerHTML=`<span class="lbl">X \u2192</span><b>${S.xAxis}</b><span style="color:var(--faint);font-size:10px">${xd.l} \u2194 ${xd.r}</span>`;
  if(cy)cy.innerHTML=`<span class="lbl">Y \u2191</span><b>${S.yAxis}</b><span style="color:var(--faint);font-size:10px">${yd.l} \u2194 ${yd.r}</span>`;
  const ybar=g('ybar'),xbar=g('xbar');
  if(ybar)ybar.querySelector('span').textContent=S.yAxis;
  if(xbar)xbar.querySelector('span').textContent=S.xAxis;
}


setTab('swot');
</script>
